id = "dorshinar.worktree-rm"
name = "Worktree Remove (background)"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Delete a worktree checkout without blocking Herdr: confirm in a popup, remove in the background, spinner on the sidebar row."
platforms = ["linux", "macos"]

[[actions]]
id = "remove"
title = "Delete worktree checkout (background)"
contexts = ["workspace"]
command = ["bash", "rm-worktree", "action"]

[[panes]]
id = "confirm"
title = "worktree-rm"
placement = "popup"
width = 74
height = 10
command = ["bash", "rm-worktree", "confirm"]
